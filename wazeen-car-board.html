<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAYEJIN Car Board | West Bengal Ulama Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#17352d;font-family:Arial,"Noto Sans Bengali",sans-serif}.topbar{max-width:1100px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:13px 18px;background:#064638;color:#fff;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer}.btn.gold{background:#a17e30}.wrap{width:min(1100px,calc(100% - 20px));margin:0 auto 32px}.board{position:relative;width:100%;aspect-ratio:2/1;background:#fff;overflow:hidden;border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}.board-bg{display:block;width:100%;height:100%;object-fit:fill}.board-logo{position:absolute;left:2.7%;top:5%;width:16.5%;height:34%;object-fit:contain;z-index:2;pointer-events:none}.qr{position:absolute;left:85.1%;top:71.1%;width:11.3%;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr canvas,.qr img{display:block!important;width:100%!important;height:100%!important;image-rendering:pixelated}.loading{padding:50px 18px;text-align:center;font-weight:800}.member{max-width:650px;margin:14px auto 0;padding:12px 16px;background:#fff;border-radius:12px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.06)}.member strong{color:#064638}.hint{font-size:12px;color:#66756f;margin-top:6px}@media(max-width:600px){.topbar{margin-top:10px}.btn{font-size:12px;padding:11px 13px}.wrap{width:calc(100% - 12px)}.board{border-radius:10px}.member{font-size:13px}}@media print{@page{size:landscape;margin:5mm}body{background:#fff}.topbar,.member{display:none!important}.wrap{width:100%;margin:0}.board{width:100%;box-shadow:none;border-radius:0;break-inside:avoid}}
</style></head><body>
<div class="topbar"><a class="btn" href="wazeens.html">← Wazeen Directory</a><button class="btn gold" id="download" type="button">⬇ Download Car Board / Save PDF</button></div>
<div class="wrap"><div id="loading" class="loading">সদস্যের তথ্য ও QR কোড লোড হচ্ছে…</div><div class="board" id="board" hidden><img class="board-bg" src="assets/wazeen-car-board-template.svg?v=20261105-2" alt="WAYEJIN E FURFURA SHARIF Car Board"><img class="board-logo" src="WBUB_Logo_Transparent_Final.png" alt="West Bengal Ulama Board logo"><div class="qr" id="qr"></div></div><div class="member" id="member" hidden></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function(){
 const params=new URLSearchParams(location.search), id=params.get("id")||"";
 const loading=document.getElementById("loading"), board=document.getElementById("board"), memberBox=document.getElementById("member");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 if(!id){loading.innerHTML='সদস্য আইডি পাওয়া যায়নি। <a href="wazeens.html">ওয়েজিন ডিরেক্টরি থেকে সদস্য নির্বাচন করুন</a>।';return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261105-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase() && x.active!==false);
  if(!person)throw new Error("member");
  if(typeof QRCode==="undefined")throw new Error("qr");
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  new QRCode(document.getElementById("qr"),{text:verify,width:220,height:220,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  loading.hidden=true;board.hidden=false;memberBox.hidden=false;
  memberBox.innerHTML='<strong>'+esc(person.name||"WAYEJIN")+'</strong> • '+esc(person.member_id||id)+'<div class="hint">এই বোর্ডটি আপনার সদস্য আইডির QR কোডসহ তৈরি হয়েছে। ডাউনলোড / Save PDF চাপুন।</div>';
  document.getElementById("download").addEventListener("click",()=>window.print());
 }catch(e){loading.textContent=e.message==="member"?"এই সদস্যের তথ্য পাওয়া যায়নি।":e.message==="qr"?"QR তৈরি করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।":"সদস্যের তথ্য লোড করা যায়নি। আবার চেষ্টা করুন।";}
})();
</script></body></html>
