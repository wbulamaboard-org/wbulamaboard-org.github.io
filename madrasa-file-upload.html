<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>মাদ্রাসা ফাইল আপলোড</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#123f35;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(135deg,#064b3d,#08765e);color:#fff;padding:28px 18px 34px}.wrap{max-width:720px;margin:auto}.arabic{font-size:20px}.brand{font-weight:800;margin-top:5px}.card{background:#fff;border:1px solid #dce8e2;border-radius:22px;padding:20px;margin:18px 0}h1{font-size:26px}.id{display:inline-block;background:#fff5c9;color:#765f0b;border-radius:30px;padding:8px 14px;font-weight:800}label{display:block;font-weight:750;margin:15px 0 7px}select,input{width:100%;padding:14px;border:1px solid #cddbd5;border-radius:13px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#08765e;color:#fff;font-weight:800;font-size:16px;margin-top:16px}.msg{padding:13px;border-radius:12px;margin-top:12px}.ok{background:#e4f6ed;color:#126044}.bad{background:#fff0f0;color:#9a2929}.file{padding:12px 0;border-bottom:1px solid #edf1ef}.file a{color:#08765e;font-weight:700}</style></head><body><header><div class="wrap"><div class="arabic">واعظینِ فرفورہ شریف</div><div class="brand">WAYEJIN E FURFURA SHARIF • WEST BENGAL ULAMA BOARD</div></div></header><main class="wrap"><section class="card"><div class="id" id="app"></div><h1>📂 মাদ্রাসার ছবি ও ফাইল আপলোড</h1><p>এখান থেকে ছবি, Gallery, PDF/Document, শিক্ষক ও শিক্ষার্থীর ফাইল আপলোড করুন।</p></section><section class="card"><label>ফাইলের ধরন</label><select id="cat"><option value="photo">📷 মাদ্রাসার মূল ছবি / Logo</option><option value="gallery">🖼️ Gallery Photo</option><option value="documents">📄 Registration / Document</option><option value="teacher">👨‍🏫 Teacher File</option><option value="student">👨‍🎓 Student File</option></select><label>ফাইল নির্বাচন করুন</label><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"><p>সর্বোচ্চ ৮ MB • JPG, PNG, WebP অথবা PDF</p><button class="btn" id="up">⬆️ ফাইল আপলোড করুন</button><div id="msg" class="msg" hidden></div></section><section class="card"><h2>📁 আপলোড করা ফাইল</h2><div id="list">লোড হচ্ছে…</div></section></main><script src="assets/member-workflow.js?v=20261003-2"></script><script>const APP=new URLSearchParams(location.search).get("application_no")||"WEFS/APP/2026/00000012";document.getElementById("app").textContent=APP;const cat=document.getElementById("cat"),file=document.getElementById("file"),up=document.getElementById("up"),msg=document.getElementById("msg"),list=document.getElementById("list");const show=(t,c)=>{msg.textContent=t;msg.className="msg "+c;msg.hidden=false};const esc=v=>String(v??"");async function load(){try{const d=await WBUB_WORKFLOW.submitApplication({action:"madrasa_files",madrasa_id:APP});const a=(d&&d.files)||[];list.innerHTML=a.length?a.map(x=>'<div class="file"><b>'+esc(x.name||x.file_name||"File")+'</b><br><small>'+esc(x.mime_type||"")+'</small> '+(x.url?'<a target="_blank" href="'+esc(x.url)+'">খুলুন</a>':"")).join(""):"এখনও কোনো ফাইল আপলোড করা হয়নি।"}catch(e){list.textContent="ফাইল তালিকা এখন লোড করা যাচ্ছে না।"}}function read(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(f)})}up.onclick=async()=>{const f=file.files&&file.files[0];if(!f)return show("আগে ফাইল নির্বাচন করুন।","bad");if(f.size>8*1024*1024)return show("ফাইল ৮ MB-এর বেশি হতে পারবে না।","bad");if(!["image/jpeg","image/png","image/webp","application/pdf"].includes(f.type))return show("শুধু JPG, PNG, WebP অথবা PDF।","bad");up.disabled=true;up.textContent="আপলোড হচ্ছে…";try{const d=await WBUB_WORKFLOW.submitApplication({action:"madrasa_upload",madrasa_id:APP,category:cat.value,file_name:f.name,mime_type:f.type,base64:await read(f)});if(!d||!d.ok)throw new Error(d&&d.error||"UPLOAD_FAILED");file.value="";show("✅ ফাইল সফলভাবে আপলোড হয়েছে।","ok");await load()}catch(e){show("ফাইল আপলোড করা যায়নি। "+(e.message||"আবার চেষ্টা করুন।"),"bad")}finally{up.disabled=false;up.textContent="⬆️ ফাইল আপলোড করুন"}};load();</script></body></html>
