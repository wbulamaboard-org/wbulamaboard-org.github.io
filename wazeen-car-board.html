<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAYEJIN Car Board | West Bengal Ulama Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#17352d;font-family:Arial,"Noto Sans Bengali",sans-serif}.topbar{max-width:1100px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:13px 18px;background:#064638;color:#fff;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer}.btn.gold{background:#a17e30}.size-note{display:inline-flex;align-items:center;padding:10px 12px;border-radius:10px;background:#fff;color:#34443f;font-size:13px;font-weight:800;border:1px solid #d9e1dd}.wrap{width:min(1100px,calc(100% - 20px));margin:0 auto 32px}.board{position:relative;width:100%;aspect-ratio:11.5/8.25;background:#fff;overflow:hidden;border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}.artwork{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;aspect-ratio:2/1}.board-bg{display:block;width:100%;height:100%;object-fit:fill}.designation{position:absolute;left:4.5%;top:42%;width:77%;height:31%;display:flex;align-items:center;justify-content:center;padding:2.5%;border:4px solid #fff;border-radius:14px;background:rgba(5,23,91,.96);color:#fff;text-align:center;font-weight:1000;font-size:clamp(17px,4.6vw,62px);line-height:1.08;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 3px rgba(0,0,0,.35);overflow:hidden}.qr{position:absolute;left:84.7%;top:69.9%;width:11.2%;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr canvas,.qr img{display:block!important;width:100%!important;height:100%!important;image-rendering:pixelated}.loading{padding:50px 18px;text-align:center;font-weight:800}.member{max-width:650px;margin:14px auto 0;padding:12px 16px;background:#fff;border-radius:12px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.06)}.member strong{color:#064638}.hint{font-size:12px;color:#66756f;margin-top:6px}@media(max-width:600px){.topbar{margin-top:10px}.btn{font-size:12px;padding:11px 13px}.wrap{width:calc(100% - 12px)}.board{border-radius:10px}.member{font-size:13px}.designation{border-width:2px;border-radius:8px;padding:1.5%;font-size:clamp(13px,4.2vw,30px)}}@media print{@page{size:11.5in 8.25in;margin:0}body{background:#fff}.topbar,.member{display:none!important}.wrap{width:100%;margin:0}.board{width:100%;box-shadow:none;border-radius:0;break-inside:avoid}}
</style></head><body>
<div class="topbar"><a class="btn" href="wazeens.html">← Wazeen Directory</a><button class="btn gold" id="download" type="button">⬇ Download Car Board (PNG)</button><span class="size-note">Print size: 292.1 × 209.55 mm (11.5 × 8.25 in) • 300 DPI</span></div>
<div class="wrap"><div id="loading" class="loading">সদস্যের তথ্য ও QR কোড লোড হচ্ছে…</div><div class="board" id="board" hidden><div class="artwork"><img class="board-bg" src="assets/WBUB_Wazeen_Car_Board_Final.jpg?v=20261105-5" alt="WAYEJIN E FURFURA SHARIF Car Board"><div class="designation" id="designation"></div><div class="qr" id="qr"></div></div></div><div class="member" id="member" hidden></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function(){
 const params=new URLSearchParams(location.search), id=params.get("id")||"";
 const loading=document.getElementById("loading"), board=document.getElementById("board"), memberBox=document.getElementById("member");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 function roleTitle(value){
  let s=String(value||"WAYEJIN").trim().replace(/\s*,\s*W\.B\. Ulama Board/i,"").replace(/\s*,\s*West Bengal Ulama Board/i,"");
  if(/^Vice[- ]President\b/i.test(s))return "VICE PRESIDENT";
  if(/^President of Ulama Board$/i.test(s))return "PRESIDENT";
  if(/^Member of (the )?Ulama Board$/i.test(s)||/^Member of Board$/i.test(s))return "BOARD MEMBER";
  return s.toUpperCase();
 }
 if(!id){loading.innerHTML='সদস্য আইডি পাওয়া যায়নি। <a href="wazeens.html">ওয়েজিন ডিরেক্টরি থেকে সদস্য নির্বাচন করুন</a>।';return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261105-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase() && x.active!==false);
  if(!person)throw new Error("member");
  if(typeof QRCode==="undefined")throw new Error("qr");
  const title=roleTitle(person.designation);
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  new QRCode(document.getElementById("qr"),{text:verify,width:220,height:220,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  document.getElementById("designation").textContent=title;
  loading.hidden=true;board.hidden=false;memberBox.hidden=false;
  memberBox.innerHTML='<strong>'+esc(title)+'</strong> • '+esc(person.member_id||id)+'<div class="hint">এই বোর্ডে সদস্যের নামের পরিবর্তে সাংগঠনিক পদ দেখানো হচ্ছে। QR কোড সদস্যের যাচাইকরণ পৃষ্ঠায় নিয়ে যাবে।</div>';
  document.getElementById("download").addEventListener("click",async()=>{
   const button=document.getElementById("download"),oldLabel=button.textContent;
   button.disabled=true;button.textContent="ছবি তৈরি হচ্ছে…";
   try{
    const bg=board.querySelector(".board-bg");
    if(!bg.complete)await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=reject;});
    const qrCanvas=document.querySelector("#qr canvas"),qrImage=document.querySelector("#qr img"),qrSource=qrCanvas||qrImage;
    if(!qrSource)throw new Error("QR");
    const canvas=document.createElement("canvas");canvas.width=3450;canvas.height=2475;
    const ctx=canvas.getContext("2d");if(!ctx)throw new Error("CANVAS");
    const boardRect=board.getBoundingClientRect(),artwork=board.querySelector(".artwork"),artworkRect=artwork.getBoundingClientRect(),qrRect=document.getElementById("qr").getBoundingClientRect(),roleRect=document.getElementById("designation").getBoundingClientRect();
    const sx=canvas.width/boardRect.width,sy=canvas.height/boardRect.height;
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
    const ax=(artworkRect.left-boardRect.left)*sx,ay=(artworkRect.top-boardRect.top)*sy,aw=artworkRect.width*sx,ah=artworkRect.height*sy;
    ctx.drawImage(bg,ax,ay,aw,ah);
    const rx=(roleRect.left-boardRect.left)*sx,ry=(roleRect.top-boardRect.top)*sy,rw=roleRect.width*sx,rh=roleRect.height*sy;
    const radius=42;ctx.beginPath();ctx.moveTo(rx+radius,ry);ctx.lineTo(rx+rw-radius,ry);ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+radius);ctx.lineTo(rx+rw,ry+rh-radius);ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-radius,ry+rh);ctx.lineTo(rx+radius,ry+rh);ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-radius);ctx.lineTo(rx,ry+radius);ctx.quadraticCurveTo(rx,ry,rx+radius,ry);ctx.closePath();ctx.fillStyle="#05175b";ctx.fill();ctx.lineWidth=18;ctx.strokeStyle="#ffffff";ctx.stroke();
    const words=title.split(/\s+/),lines=[];let line="";ctx.font="900 150px Arial, sans-serif";
    for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>rw*.88&&line){lines.push(line);line=word;}else line=test;}if(line)lines.push(line);
    const fontSize=Math.min(150,Math.max(62,Math.floor(rh*.62/Math.max(1,lines.length))));ctx.font="900 "+fontSize+"px Arial, sans-serif";ctx.fillStyle="#ffffff";ctx.textAlign="center";ctx.textBaseline="middle";
    const lineH=fontSize*1.12,startY=ry+rh/2-(lines.length-1)*lineH/2;lines.forEach((t,i)=>ctx.fillText(t,rx+rw/2,startY+i*lineH,rw*.9));
    const qx=(qrRect.left-boardRect.left)*sx,qy=(qrRect.top-boardRect.top)*sy,qw=qrRect.width*sx,qh=qrRect.height*sy;ctx.drawImage(qrSource,qx,qy,qw,qh);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob)throw new Error("PNG");
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(person.member_id||id)+"-Car-Board.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
   }catch(err){alert("বোর্ডের ছবি ডাউনলোড করা যায়নি। আবার চেষ্টা করুন।");}
   finally{button.disabled=false;button.textContent=oldLabel;}
  });
 }catch(e){loading.textContent=e.message==="member"?"এই সদস্যের তথ্য পাওয়া যায়নি।":e.message==="qr"?"QR তৈরি করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।":"সদস্যের তথ্য লোড করা যায়নি। আবার চেষ্টা করুন।";}
})();
</script></body></html>
