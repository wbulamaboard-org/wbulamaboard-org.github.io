<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সদস্য এলাকা | WAYEJIN FURFURA SHARIF</title><link rel="stylesheet" href="assets/site.css"><style>.workflow{max-width:760px;margin:auto}.cardx{background:#fff;border:1px solid #dce6e0;border-radius:18px;padding:24px;box-shadow:var(--shadow)}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd9d2;border-radius:9px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:900;font-size:16px}.workflow-message{margin-top:16px;padding:13px;border-radius:9px}.workflow-message.error{background:#fff0f0;color:#8a2222}.profile{margin-top:18px;padding:18px;border-radius:12px;background:#f5f8f6}.success-head{color:#0b654d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions a{flex:1;min-width:180px;text-align:center;padding:12px;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:900;text-decoration:none}.actions a.secondary{background:#07513f;color:#fff}.note{margin-top:14px;font-size:13px;color:#52645c}@media(max-width:620px){.cardx{padding:18px}.actions{flex-direction:column}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">ওয়েজিন ফুরফুরা শরীফ<small>WAYEJIN E FURFURA SHARIF</small></a><nav><a href="registration.html">নিবন্ধন</a><a href="status.html">স্ট্যাটাস</a><a href="verification.html">ভেরিফিকেশন</a></nav></div></header><main><section><div class="wrap workflow"><div class="cardx"><h1>সদস্য এলাকা</h1><p class="muted">Application Number ও নিবন্ধিত মোবাইল নম্বর দিয়ে নিজের approved membership profile এবং Digital ID Card দেখুন।</p><form id="f"><label>Application Number *</label><input id="a" required autocomplete="off"><label>নিবন্ধিত মোবাইল নম্বর *</label><input id="m" required inputmode="numeric" maxlength="10" placeholder="১০ সংখ্যার মোবাইল নম্বর"><button id="b">প্রোফাইল দেখুন</button></form><div id="msg" hidden></div><div id="p" class="profile" hidden></div></div></div></section></main><script src="assets/member-workflow.js"></script><script src="assets/site.js" defer></script><script>const f=document.getElementById("f"),msg=document.getElementById("msg"),p=document.getElementById("p"),b=document.getElementById("b");f.addEventListener("submit",async e=>{e.preventDefault();msg.hidden=true;p.hidden=true;const a=document.getElementById("a").value.trim(),m=document.getElementById("m").value;if(!a||!WBUB_WORKFLOW.validMobile(m)){WBUB_WORKFLOW.showMessage(msg,"error","সঠিক তথ্য দিন।");return}WBUB_WORKFLOW.setBusy(b,true,"তথ্য যাচাই হচ্ছে…");try{const d=await WBUB_WORKFLOW.lookupMember(a,m);if(d.found!==true||!d.record)throw new Error("NOT_FOUND");const r=d.record;const memberId=r.member_id||r.wazeen_id||"";if(String(r.status||"").toLowerCase()!=="approved"||!memberId)throw new Error("NOT_APPROVED");const mid=encodeURIComponent(memberId);p.innerHTML="<h2 class='success-head'>✓ সদস্যপদ অনুমোদিত</h2><p><strong>নাম:</strong> "+WBUB_WORKFLOW.escapeHtml(r.name||"Member")+"</p><p><strong>Member ID:</strong> "+WBUB_WORKFLOW.escapeHtml(memberId)+"</p><p><strong>Designation:</strong> "+WBUB_WORKFLOW.escapeHtml(r.designation||"Member")+"</p><p><strong>District:</strong> "+WBUB_WORKFLOW.escapeHtml(r.district||"-")+"</p><div class='actions'><a class='secondary' href='wazeen-id.html?id="+mid+"'>🪪 ID Card খুলুন ও Download করুন</a><a href='verification.html?id="+mid+"'>✓ QR Verification</a></div><p class='note'>ID Card পেজে approved photo, নাম, Member ID, জেলা, validity ও verification QR স্বয়ংক্রিয়ভাবে বসবে। সেখান থেকে PNG Download অথবা Print / Save PDF করা যাবে।</p>";p.hidden=false}catch(err){WBUB_WORKFLOW.showMessage(msg,"error",err.message==="NOT_FOUND"?"রেকর্ড পাওয়া যায়নি।":err.message==="NOT_APPROVED"?"আপনার আবেদন এখনও অনুমোদিত হয়নি।":"সদস্য সার্ভিসে সংযোগ করা যাচ্ছে না। পরে আবার চেষ্টা করুন।")}finally{WBUB_WORKFLOW.setBusy(b,false)}});</script></body></html>
