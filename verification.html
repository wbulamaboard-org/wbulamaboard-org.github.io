<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wazeen ID Verification | WAYEJIN FURFURA SHARIF</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;

}

.header{
    max-width:1100px;

    display:flex;

.container{
    max-width:750px;
    margin:auto;
    padding:40px 15px 60px;
}

h1{
    text-align:center;

    margin:0;
    font-size:30px;
}

.subtitle{
    text-align:center;

    font-size:11px;
    margin:7px 0 25px;
}

.search-box{
    background:white;

    border-radius:15px;
    box-shadow:0 6px 25px rgba(0,0,0,.10);

    display:block;
    font-weight:bold;
    font-size:12px;
    margin-bottom:7px;
}

.search{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    height:47px;
    border:1px solid #d7ddd9;
    border-radius:8px;

}

button{
    height:47px;
    padding:0 22px;
    border:0;
    border-radius:8px;
    background:#064c3c;
    color:white;
    font-weight:bold;
}

#result{
    margin-top:22px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(0,0,0,.12);
}

.card-head{
    background:#064c3c;
    color:white;
    text-align:center;
    padding:22px;
}

.card-head h2{
    margin:9px 0 3px;
    font-size:22px;
}

.card-head p{
    margin:0;
    font-size:10px;
}

.status{
    display:inline-block;
    padding:6px 15px;
    border-radius:20px;
    background:#fff0bd;
    color:#705500;
    font-size:10px;
    font-weight:bold;
}

.status.approved{

}

}

}

}

.message{
    background:white;
    padding:25px;

    border-radius:14px;

    font-size:13px;

footer{

    .container{
        padding:30px 13px 50px;
    }

    h1{
        font-size:25px;

    .search{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    .row{
        font-size:11px;

</style>

</head>

<body>

<div class="top">
WAYEJIN FURFURA SHARIF • WEST BENGAL ULAMA BOARD
</div>

<header>

<div class="header">

<div class="brand">
ওয়েজিন ফুরফুরা শরীফ
<small>WAYEJIN E FURFURA SHARIF</small>
</div>

<div class="menu">
☰ MENU
</div>

</div>

</header>


<div class="container">

<h1>Wazeen ID Verification</h1>

<div class="subtitle">
WEST BENGAL ULAMA BOARD • OFFICIAL VERIFICATION PORTAL
</div>


<div class="search-box">

<label>
Application No অথবা Wazeen ID
</label>

<div class="search">

<input
id="searchInput"
type="text"
placeholder="WEFS/APP/2026/00000001 অথবা WBUB/WF/0001/26"
>

<button onclick="verify()">
VERIFY
</button>

</div>

</div>


<div id="result"></div>

</div>


<footer>

<strong>WAYEJIN FURFURA SHARIF</strong>

<br><br>

WEST BENGAL ULAMA BOARD

</footer>


<script>

/* ================= API ================= */

const API =
"https://script.google.com/macros/s/AKfycbwSxUaa1FKHM4xXFauCApz5aT1usl11-BAAQ9OULwL1uGd8G_78Qh6JhJEcFo1kJz6UWw/exec";


/* ================= VERIFY ================= */

async function verify(){

    const input =
        document.getElementById("searchInput");

    const result =
        document.getElementById("result");

    const id =
        input.value.trim();


    if(!id){

        result.innerHTML = `
        <div class="message">
            অনুগ্রহ করে Application No অথবা Wazeen ID লিখুন।
        </div>
        `;

        return;
    }


    result.innerHTML = `
    <div class="message">
        যাচাই করা হচ্ছে...
    </div>
    `;


    try{

        const response =
            await fetch(
                API +
                "?id=" +
                encodeURIComponent(id)
            );


        const data =
            await response.json();


        if(
            data.ok &&
            data.found &&
            data.record
        ){

            showResult(
                data.record
            );

        }else{

            result.innerHTML = `
            <div class="message">
                ❌ এই নম্বরের কোনো রেকর্ড পাওয়া যায়নি।
            </div>
            `;

        }


    }catch(error){

        result.innerHTML = `
        <div class="message">
            ⚠️ Verification server-এর সঙ্গে সংযোগ করা যায়নি।
            <br><br>
            কিছুক্ষণ পরে আবার চেষ্টা করুন।
        </div>
        `;

    }

}


/* ================= SHOW RESULT ================= */

function showResult(r){

    const result =
        document.getElementById("result");


    let status =
        String(
            r.status || "PENDING"
        ).toUpperCase();


    let statusClass = "";

    if(status === "APPROVED"){
        statusClass = "approved";
    }

    if(status === "REJECTED"){
        statusClass = "rejected";
    }


    result.innerHTML = `

    <div class="card">

        <div class="card-head">

            <span class="status ${statusClass}">
                ${safe(status)}
            </span>

            <h2>
                ${safe(r.name || "Name Not Available")}
            </h2>

            <p>
                WAYEJIN FURFURA SHARIF
            </p>

        </div>


        <div class="info">

            <div class="row">
                <div class="key">
                    Application No
                </div>

                <div class="value">
                    ${safe(r.application_no || "-")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    Wazeen ID
                </div>

                <div class="value">
                    ${safe(r.wazeen_id || "-")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    Designation
                </div>

                <div class="value">
                    ${safe(r.designation || r.experience || "Wazeen")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    District
                </div>

                <div class="value">
                    ${safe(r.district || "-")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    Mobile
                </div>

                <div class="value">
                    ${safe(r.mobile || "-")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    Valid Till
                </div>

                <div class="value">
                    ${safe(r.valid_till || "-")}
                </div>
            </div>


            <div class="row">
                <div class="key">
                    Application Date
                </div>

                <div class="value">
                    ${safe(r.created_at || "-")}
                </div>
            </div>

        </div>


        <div class="success">

            ✓ RECORD FOUND IN
            WEST BENGAL ULAMA BOARD DATABASE

        </div>

    </div>

    `;

}


/* ================= SECURITY ================= */

function safe(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================= ENTER ================= */

document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            verify();
        }

    }
);


/* ================= QR AUTO SEARCH ================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const qrId =
    params.get("id");


if(qrId){

    document
    .getElementById("searchInput")
    .value = qrId;

    verify();

}

</script>

</body>
</html>
