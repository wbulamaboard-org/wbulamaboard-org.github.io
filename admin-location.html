<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Live Location</title><link rel="stylesheet" href="assets/site.css"><style>body{background:#f5f8f6}.wrap2{max-width:1000px;margin:auto;padding:25px 16px}.panel{background:#fff;border:1px solid #dce7e1;border-radius:18px;padding:20px;box-shadow:0 12px 32px rgba(7,54,42,.07);margin-bottom:16px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:220px;padding:12px;border:1px solid #ccdcd5;border-radius:9px}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#07513f;color:#fff}.gold{background:#d7b45b;color:#17372d}.msg{margin-top:12px;padding:12px;border-radius:9px;background:#eef6f2}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #dce7e1;border-radius:15px;padding:15px;background:#fff}.card h3{margin:0 0 8px;color:#07382c}.muted{color:#718079;font-size:12px}.mapbtn{display:inline-block;margin-top:10px;background:#07513f;color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">WAYEJIN E FURFURA SHARIF<small>ADMIN • LIVE LOCATION</small></a><nav><a href="admin.html">Admin</a></nav></div></header><main><div class="wrap2"><div class="panel"><h1>📍 Admin Live Location</h1><p class="muted">সদস্য নিজে Start Tracking চালু করলে তার সর্বশেষ পাঠানো লোকেশন এখানে দেখা যাবে।</p><div class="bar"><input id="key" type="password" placeholder="Admin Key"><button class="btn primary" id="load">লোকেশন দেখুন</button><button class="btn gold" id="refresh">↻ Refresh</button></div><div id="msg" class="msg">Admin Key দিয়ে লোকেশন তালিকা লোড করুন।</div></div><div id="cards" class="cards"></div></div></main><script>const API="https://script.google.com/macros/s/AKfycbwU4b_3e8r8dglJHcIqVAKk_fjWfdexUJEVKbCcv5tfkSInlOqgDwYoKwtwGSIiiJv5/exec";const $=x=>document.getElementById(x);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}async function load(){const k=$("key").value.trim();if(!k){$("msg").textContent="Admin Key দিন।";return}$("msg").textContent="লোড হচ্ছে…";try{const u=API+"?action=list_locations&admin_key="+encodeURIComponent(k)+"&_="+Date.now();const r=await fetch(u,{cache:"no-store"});const d=await r.json();const rows=d.records||d.locations||d.data||[];if(d.ok!==true&&rows.length===0)throw new Error(d.error||"LOCATION_LIST_NOT_AVAILABLE");$("cards").innerHTML=rows.length?rows.map(x=>{const lat=Number(x.lat??x.latitude),lng=Number(x.lng??x.longitude);return `<div class="card"><h3>📍 ${esc(x.member_id||x.wazeen_id||"Member")}</h3><div class="muted">Mobile: ${esc(x.mobile||"—")}</div><div style="margin-top:8px"><b>Latitude:</b> ${isNaN(lat)?"—":lat}<br><b>Longitude:</b> ${isNaN(lng)?"—":lng}<br><b>Accuracy:</b> ${esc(x.accuracy||"—")}<br><b>Updated:</b> ${esc(x.timestamp||x.updated_at||"—")}</div>${!isNaN(lat)&&!isNaN(lng)?`<a class="mapbtn" target="_blank" href="https://www.google.com/maps?q=${lat},${lng}">🗺️ Google Maps</a>`:""}</div>`}).join(""):"<div class='panel'>কোনো সদস্যের লোকেশন পাওয়া যায়নি।</div>";$("msg").textContent="✓ লোকেশন তালিকা আপডেট হয়েছে।"}catch(e){$("msg").textContent="লোকেশন তালিকা আনা যায়নি: "+e.message}}</script><script>load.onclick=load;refresh.onclick=load;</script></body></html>
