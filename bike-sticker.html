<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bike Sticker | West Bengal Ulama Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#10224d;font-family:Arial,"Noto Sans Bengali",sans-serif}.actions{max-width:1000px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:12px 17px;background:#09245e;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.note{background:#fff;border:1px solid #dce1e9;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700}.stage{width:min(1000px,calc(100% - 24px));margin:0 auto 30px;background:#fff;padding:30px 20px;box-shadow:0 12px 30px #0002;border-radius:14px}.sticker{position:relative;width:100%;aspect-ratio:2.25/1;background:#fff;border:8px solid #071b58;border-radius:28px;padding:7px;box-shadow:inset 0 0 0 3px #e6b93f;overflow:hidden}.inner{height:100%;border:2px solid #e4b73c;border-radius:17px;position:relative;overflow:hidden;padding:12px 15px 10px 26%;background:linear-gradient(125deg,#fff 0 75%,#f7f9ff 75%)}.inner:before{content:"";position:absolute;left:0;top:0;width:17%;height:100%;background:linear-gradient(140deg,#d20c18 0 25%,#fff 25% 31%,#071b58 31% 36%,transparent 36%);opacity:.95}.logo{position:absolute;z-index:2;left:2.4%;top:50%;transform:translateY(-50%);width:21%;height:auto;max-height:85%;object-fit:contain}.heading{text-align:center;font-size:clamp(18px,4.3vw,46px);font-weight:1000;letter-spacing:-1.3px;line-height:1;color:#071b58;font-style:italic;white-space:nowrap}.greenline{height:4px;background:#08743f;width:78%;margin:5px auto 8px;border-radius:10px}.sub{text-align:center;background:#c70d19;color:white;border-radius:30px;padding:5px 12px;font-size:clamp(12px,2.4vw,25px);font-weight:900;font-style:italic}.dutyrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 6px}.duty{font-size:clamp(28px,6.8vw,72px);font-weight:1000;letter-spacing:2px;color:#fff;background:linear-gradient(100deg,#061b5c,#173dba);padding:0 28px;border-radius:10px;line-height:1.18;font-style:italic}.bike{font-size:clamp(35px,6vw,65px);color:#071b58}.footer{background:#c90d1a;color:#fff;text-align:center;padding:5px 10px;border-radius:7px;font-size:clamp(12px,2.7vw,27px);font-weight:900;width:82%}.bike-qr{position:absolute;right:2.2%;bottom:8.5%;width:13%;aspect-ratio:1;background:#fff;padding:4px;border:2px solid #071b58;border-radius:7px;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 1px 4px #0002}.bike-qr canvas,.bike-qr img{width:100%!important;height:100%!important;display:block!important}.qr-label{position:absolute;right:2.2%;bottom:1.5%;width:13%;text-align:center;font-size:clamp(5px,.8vw,9px);font-weight:900;color:#071b58;letter-spacing:.2px}.mosque{position:absolute;left:0;bottom:0;color:#8bb5eb;font-size:clamp(18px,3vw,32px);opacity:.85}.sticker:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,#071b58 0 22%,#fff 22% 26%,#d20c18 26% 82%,#e6b93f 82%)}.caption{text-align:center;color:#5e6877;font-size:12px;margin-top:14px}
@media(max-width:600px){.stage{padding:12px 6px}.sticker{border-width:5px;border-radius:16px;padding:4px}.inner{border-radius:10px;padding:7px 5px 6px 25%}.heading{letter-spacing:-.6px}.dutyrow{gap:4px;margin:5px 0}.duty{padding:0 10px;letter-spacing:0}.logo{left:2%;width:21%}.sub{padding:4px 5px}.footer{padding:3px 4px;width:82%}.bike-qr{right:2%;bottom:8%;width:13%;padding:2px}.qr-label{right:1.5%;bottom:1.5%;width:14%}}
@media print{@page{size:A5 landscape;margin:0}body{background:#fff}.actions,.caption{display:none!important}.stage{width:210mm;height:148.5mm;margin:0;padding:16mm 5mm;box-shadow:none;border-radius:0}.sticker{width:200mm;height:88.9mm;margin:0 auto;aspect-ratio:auto;border-radius:5mm}.inner{border-radius:3mm}}
</style></head><body>
<div class="actions"><a class="btn" href="index.html">← হোম</a><button class="btn" onclick="window.print()">🖨️ A4-এর হাফ সাইজে প্রিন্ট</button><span class="note">প্রিন্ট পেপার: A5 Landscape (A4-এর অর্ধেক) • 300 DPI উপযোগী ডিজাইন</span></div>
<div class="stage"><div class="sticker"><div class="inner">
<img class="logo" src="WBUB_Logo_Transparent_Final.png?v=20261105-2" alt="West Bengal Ulama Board Logo">
<div class="heading">West Bengal Ulama Board</div><div class="greenline"></div>
<div class="sub">Wayejin Furfura Sharif</div>
<div class="dutyrow"><div class="duty">ON DUTY</div><div class="bike">🏍</div></div>
<div class="footer">ধর্মীয় দায়িত্বে নিয়োজিত</div><div class="mosque">☪ ▥ ▴ ▥</div><div class="bike-qr" id="bikeQr" role="img" aria-label="প্রত্যেক সদস্যের আলাদা QR যাচাইকরণ কোড"></div><div class="qr-label">SCAN TO VERIFY</div>
</div></div><div class="caption">বাইকের লম্বা স্টিকার • বোর্ডের আসল লোগো ব্যবহার করা হয়েছে</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'"></script>
<script>
(async function(){
 const id=new URLSearchParams(location.search).get("id")||"";
 const box=document.getElementById("bikeQr"),label=document.querySelector(".qr-label"),cap=document.getElementById("caption");
 if(!id){box.style.display="none";label.style.display="none";cap.textContent="প্রত্যেক সদস্যের নিজস্ব QR যুক্ত করতে ওয়েজিন ডিরেক্টরি থেকে সদস্যের Bike Sticker খুলুন";return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261105-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase()&&x.active!==false);
  if(!person)throw new Error("member");
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  if(typeof QRCode!=="undefined"){
   box.replaceChildren();\n   new QRCode(box,{text:verify,width:300,height:300,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  } else {
   const qrImg=document.createElement("img");
   qrImg.alt="Member verification QR code";qrImg.referrerPolicy="no-referrer";
   qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&format=png&data="+encodeURIComponent(verify);
   await new Promise((resolve,reject)=>{qrImg.onload=()=>{box.replaceChildren(qrImg);resolve()};qrImg.onerror=reject;});
  }
  cap.textContent=(person.name||"সদস্য")+" • "+(person.member_id||id)+" • QR স্ক্যান করে সদস্য যাচাই করুন";
 }catch(e){box.style.display="none";label.style.display="none";cap.textContent="সদস্যের QR তৈরি করা যায়নি। আবার চেষ্টা করুন।";}
})();
</script></body></html>
