<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>সদস্য ভেরিফিকেশন | WEST BENGAL ULAMA BOARD</title>
<link rel="stylesheet" href="assets/site.css">
<style>
.verify{max-width:700px;margin:auto}.search{display:flex;gap:8px;background:#fff;padding:14px;border-radius:12px;box-shadow:var(--shadow)}.search input{flex:1;min-width:0;padding:13px;border:1px solid #cbd9d2;border-radius:8px;font-size:16px}.search button{padding:0 18px;border:0;border-radius:8px;background:#07513f;color:#fff;font-weight:900}.result{margin-top:18px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}.headx{background:#07513f;color:#fff;text-align:center;padding:20px}.status{display:inline-block;padding:6px 12px;border-radius:999px;background:#e2c879;color:#604e00;font-weight:900}.name{font-size:23px;font-weight:900;margin-top:8px}.info{padding:18px}.row{display:flex;padding:11px 0;border-bottom:1px solid #e5ece8;gap:20px}.row span{width:42%;color:#69756f}.row strong{width:58%}.error{margin-top:18px;background:#fff0f0;color:#8a2222;padding:15px;border-radius:10px;text-align:center}.photo{max-width:100px;max-height:120px;border-radius:10px;margin:10px auto;display:block}@media(max-width:620px){.search{flex-direction:column}.search button{padding:13px}.row{display:block}.row span,.row strong{display:block;width:100%}.row strong{margin-top:3px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html">ওয়েজিন ফুরফুরা শরীফ<small>WAYEJIN E FURFURA SHARIF</small></a><nav><a href="registration.html">নিবন্ধন</a><a href="status.html">স্ট্যাটাস</a><a href="verification.html">ভেরিফিকেশন</a><a href="member.html">সদস্য এলাকা</a></nav></div></header>
<main><section><div class="wrap verify"><div class="head"><h1>Official Member Verification</h1><p class="muted">WEST BENGAL ULAMA BOARD • WAYEJIN E FURFURA SHARIF</p></div>
<div class="search"><input id="q" placeholder="Member ID অথবা মোবাইল নম্বর দিন" autocomplete="off"><button id="btn">SEARCH</button></div>
<div id="error" class="error" hidden></div><div id="result" class="result" hidden><div class="headx"><div id="status" class="status">VERIFIED</div><img id="photo" class="photo" hidden><div id="name" class="name"></div><div>WAYEJIN E FURFURA SHARIF</div></div><div class="info"><div class="row"><span>Member ID</span><strong id="mid"></strong></div><div class="row"><span>Organization</span><strong id="org"></strong></div><div class="row"><span>Designation / Category</span><strong id="des"></strong></div><div class="row"><span>District / Block</span><strong id="district"></strong></div><div class="row"><span>Validity</span><strong id="valid"></strong></div></div></div>
</div></section></main>
<script>
const q=document.getElementById("q"),btn=document.getElementById("btn"),err=document.getElementById("error"),box=document.getElementById("result");
let MEMBERS=[];
function safe(v,f="-"){const s=String(v??"").trim();return s&&s!=="undefined"&&s!=="null"?s:f}
function normPhone(v){return String(v||"").replace(/\D/g,"").slice(-10)}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function loadMembers(){if(MEMBERS.length)return;const r=await fetch("assets/member-directory-all.json?v=20260922",{cache:"no-store"});MEMBERS=await r.json()}
function showOne(r){
 document.getElementById("status").textContent="✓ MEMBER RECORD";
 document.getElementById("name").textContent=safe(r.name);
 document.getElementById("mid").textContent=safe(r.member_id);
 document.getElementById("org").textContent="West Bengal Ulama Board";
 document.getElementById("des").textContent=safe(r.designation);
 document.getElementById("district").textContent=safe(r.address);
 document.getElementById("valid").textContent=safe(r.validity);
 document.getElementById("photo").hidden=true; box.hidden=false;
}
async function verify(){
 err.hidden=true;box.hidden=true;const raw=q.value.trim();if(!raw){err.textContent="Member ID অথবা মোবাইল নম্বর দিন।";err.hidden=false;return}
 btn.disabled=true;btn.textContent="SEARCHING…";
 try{
  await loadMembers();
  const id=raw.toUpperCase().replace(/\s/g,"");
  const phone=normPhone(raw);
  let matches=MEMBERS.filter(r=>String(r.member_id).toUpperCase()===id);
  if(!matches.length && /^\d{10,}$/.test(phone)) matches=MEMBERS.filter(r=>r.phone_key===phone);
  if(!matches.length) throw new Error("NOT_FOUND");
  if(matches.length===1){showOne(matches[0]);}
  else{
    box.hidden=false;document.getElementById("status").textContent="✓ MULTIPLE RECORDS";
    document.getElementById("name").textContent="একাধিক সদস্য পাওয়া গেছে";
    document.getElementById("mid").textContent=matches.map(r=>r.member_id).join(" • ");
    document.getElementById("org").textContent="একই মোবাইল নম্বর একাধিক রেকর্ডে আছে";
    document.getElementById("des").textContent=matches.map(r=>r.name).join(" | ");
    document.getElementById("district").textContent="উপরের Member ID ব্যবহার করে আলাদা করে যাচাই করুন";
    document.getElementById("valid").textContent="—";document.getElementById("photo").hidden=true;
  }
 }catch(e){err.textContent="Member ID / মোবাইল নম্বর পাওয়া যায়নি।";err.hidden=false}
 finally{btn.disabled=false;btn.textContent="SEARCH"}
}
btn.addEventListener("click",verify);q.addEventListener("keydown",e=>{if(e.key==="Enter")verify()});
const id=new URLSearchParams(location.search).get("id");if(id){q.value=id;verify()}
</script><script src="assets/site.js" defer></script>
</body></html>
