<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#17352d;font-family:Arial,"Noto Sans Bengali",sans-serif}.topbar{max-width:1100px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:13px 18px;background:#064638;color:#fff;font-weight:900;font-size:15px;text-decoration:none;cursor:pointer}.btn.gold{background:#a17e30}.size-note{display:inline-flex;align-items:center;padding:10px 12px;border-radius:10px;background:#fff;color:#34443f;font-size:13px;font-weight:800;border:1px solid #d9e1dd}.wrap{width:min(1100px,calc(100% - 20px));margin:0 auto 32px}.board{position:relative;width:100%;aspect-ratio:11.5/8.25;background:#fff;overflow:hidden;border-radius:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}.artwork{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;aspect-ratio:1.5/1}.board-bg{display:block;width:100%;height:100%;object-fit:fill}.designation-plaque{position:absolute;left:15%;top:64%;width:68%;height:16%;display:flex;align-items:center;justify-content:center;gap:2%;padding:1% 2%;border:5px solid #ffd84a;border-radius:999px;background:linear-gradient(180deg,#a20a0a 0%,#650000 100%);box-shadow:inset 0 0 0 4px #f6d55b,0 4px 9px rgba(0,0,0,.48);color:#ffe600;text-align:center;font-weight:1000;overflow:visible}.plaque-icon{width:14%;height:76%;display:flex;align-items:center;justify-content:center;flex:none}.plaque-icon svg{width:100%;height:100%;max-width:92px}.plaque-divider{height:68%;width:3px;background:#ffe7a0;box-shadow:1px 0 2px #3c0000;flex:none}.plaque-text{flex:1;min-width:0;text-align:center;font-size:clamp(14px,4.2vw,54px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 2px 2px #360000}.plaque-flourish{position:absolute;top:50%;transform:translateY(-50%);color:#ffdf36;font-family:Georgia,serif;font-size:clamp(25px,5vw,65px);line-height:1;text-shadow:0 1px 2px #4b1800}.plaque-flourish.left{left:-5.5%}.plaque-flourish.right{right:-5.5%}.qr{position:absolute;left:84.7%;top:69.9%;width:11.2%;aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.qr canvas,.qr img{display:block!important;width:100%!important;height:100%!important;image-rendering:pixelated}.loading{padding:50px 18px;text-align:center;font-weight:800}.member{max-width:650px;margin:14px auto 0;padding:12px 16px;background:#fff;border-radius:12px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.06)}.member strong{color:#064638}.hint{font-size:12px;color:#66756f;margin-top:6px}@media(max-width:600px){.topbar{margin-top:10px}.btn{font-size:12px;padding:11px 13px}.wrap{width:calc(100% - 12px)}.board{border-radius:10px}.member{font-size:13px}.designation-plaque{border-width:3px;box-shadow:inset 0 0 0 3px #f6d55b,0 3px 6px rgba(0,0,0,.45);gap:1.5%;padding:1% 2%}.plaque-divider{width:2px}.plaque-text{font-size:clamp(12px,4vw,31px)}.plaque-flourish{font-size:clamp(20px,5vw,38px)}}@media print{@page{size:11.5in 8.25in;margin:0}body{background:#fff}.topbar,.member{display:none!important}.wrap{width:100%;margin:0}.board{width:100%;box-shadow:none;border-radius:0;break-inside:avoid}}
</style></head><body>
<div class="topbar"><a class="btn" href="wazeens.html">← Wazeen Directory</a><button class="btn gold" id="download" type="button">⬇ Download Car Board (PNG)</button><span class="size-note">Print size: 292.1 × 209.55 mm (11.5 × 8.25 in) • 300 DPI</span></div>
<div class="wrap"><div id="loading" class="loading">সদস্যের তথ্য ও QR কোড লোড হচ্ছে…</div><div class="board" id="board" hidden><div class="artwork"><img class="board-bg" src="assets/WBUB_Wazeen_Car_Board_Final.jpg?v=20261116-1" alt="WAYEJIN E FURFURA SHARIF Car Board"><div class="qr" id="qr"></div><div class="designation-plaque" id="designation"><span class="plaque-flourish left">❧</span><span class="plaque-icon"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff"><circle cx="50" cy="17" r="11"/><circle cx="20" cy="52" r="9"/><circle cx="80" cy="52" r="9"/><path d="M32 48c0-11 8-18 18-18s18 7 18 18v7H32zM5 76c0-10 7-17 15-17s15 7 15 17v9H5zM65 76c0-10 7-17 15-17s15 7 15 17v9H65zM35 83c0-12 6-21 15-21s15 9 15 21v9H35z"/></g></svg></span><span class="plaque-divider"></span><span class="plaque-text" id="designationText"></span><span class="plaque-flourish right">❧</span></div></div></div><div class="member" id="member" hidden></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function(){
 const params=new URLSearchParams(location.search), id=params.get("id")||"";
 const loading=document.getElementById("loading"), board=document.getElementById("board"), memberBox=document.getElementById("member");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 function roleTitle(value){
  let s=String(value||"WAYEJIN").trim().replace(/\s*,\s*W\.B\. Ulama Board/ig,"").replace(/\s*,\s*West Bengal Ulama Board/ig,"").replace(/\s+/g," ").trim();
  if(/^Vice[- ]President\b/i.test(s))return "VICE PRESIDENT";
  if(/^President(?: of Ulama Board)?$/i.test(s))return "PRESIDENT";
  if(/^Member(?: of|,)\s*(the\s*)?(Ulama Board|W\.B\. Ulama Board)?$/i.test(s)||/^General Member$|^Ulama Member$/i.test(s))return "MEMBER";
  return s.toUpperCase();
 }
 if(!id){loading.innerHTML='সদস্য আইডি পাওয়া যায়নি। <a href="wazeens.html">ওয়েজিন ডিরেক্টরি থেকে সদস্য নির্বাচন করুন</a>।';return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261116-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase() && x.active!==false);
  if(!person)throw new Error("member");
  if(typeof QRCode==="undefined")throw new Error("qr");
  const title=roleTitle(person.designation);
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  new QRCode(document.getElementById("qr"),{text:verify,width:220,height:220,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  document.getElementById("designationText").textContent=title;
  loading.hidden=true;board.hidden=false;memberBox.hidden=false;
  memberBox.innerHTML='<strong>'+esc(title)+'</strong> • '+esc(person.member_id||id)+'<div class="hint">বোর্ডে সদস্যের নামের পরিবর্তে তাঁর সাংগঠনিক পদ দেখানো হচ্ছে। QR কোড সদস্যের যাচাইকরণ পৃষ্ঠায় নিয়ে যাবে।</div>';
  document.getElementById("download").addEventListener("click",async()=>{
   const button=document.getElementById("download"),oldLabel=button.textContent;
   button.disabled=true;button.textContent="ছবি তৈরি হচ্ছে…";
   try{
    const bg=board.querySelector(".board-bg");
    if(!bg.complete)await new Promise((resolve,reject)=>{bg.onload=resolve;bg.onerror=reject;});
    const qrSource=document.querySelector("#qr canvas")||document.querySelector("#qr img");
    if(!qrSource)throw new Error("QR");
    const canvas=document.createElement("canvas");canvas.width=3450;canvas.height=2475;
    const ctx=canvas.getContext("2d");if(!ctx)throw new Error("CANVAS");
    const boardRect=board.getBoundingClientRect(),artwork=board.querySelector(".artwork"),artworkRect=artwork.getBoundingClientRect(),qrRect=document.getElementById("qr").getBoundingClientRect(),plaqueRect=document.getElementById("designation").getBoundingClientRect();
    const sx=canvas.width/boardRect.width,sy=canvas.height/boardRect.height;
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
    const ax=(artworkRect.left-boardRect.left)*sx,ay=(artworkRect.top-boardRect.top)*sy,aw=artworkRect.width*sx,ah=artworkRect.height*sy;
    ctx.drawImage(bg,ax,ay,aw,ah);
    const px=(plaqueRect.left-boardRect.left)*sx,py=(plaqueRect.top-boardRect.top)*sy,pw=plaqueRect.width*sx,ph=plaqueRect.height*sy,radius=ph/2;
    ctx.beginPath();ctx.roundRect(px,py,pw,ph,radius);ctx.fillStyle="#790606";ctx.fill();ctx.lineWidth=22;ctx.strokeStyle="#ffd84a";ctx.stroke();
    ctx.beginPath();ctx.roundRect(px+15,py+15,pw-30,ph-30,Math.max(1,radius-15));ctx.lineWidth=12;ctx.strokeStyle="#f6d55b";ctx.stroke();
    ctx.fillStyle="#ffdf36";ctx.font="bold "+Math.floor(ph*.72)+"px Georgia,serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("❧",px+pw*.025,py+ph*.51);ctx.fillText("❧",px+pw*.975,py+ph*.51);
    const iconX=px+pw*.105,iconY=py+ph*.18,iconW=pw*.105,iconH=ph*.64;ctx.fillStyle="#ffffff";
    const headR=ph*.095;ctx.beginPath();ctx.arc(iconX+iconW*.5,iconY+headR,headR,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(iconX+iconW*.19,iconY+iconH*.52,headR*.78,0,Math.PI*2);ctx.arc(iconX+iconW*.81,iconY+iconH*.52,headR*.78,0,Math.PI*2);ctx.fill();
    ctx.fillRect(iconX+iconW*.31,iconY+iconH*.42,iconW*.38,iconH*.27);ctx.fillRect(iconX,iconY+iconH*.69,iconW*.34,iconH*.25);ctx.fillRect(iconX+iconW*.66,iconY+iconH*.69,iconW*.34,iconH*.25);
    ctx.fillStyle="#ffe7a0";ctx.fillRect(px+pw*.245,py+ph*.2,10,ph*.6);
    const maxWidth=pw*.61,fontSize=Math.min(170,ph*.55);ctx.font="900 "+fontSize+"px Arial,sans-serif";ctx.fillStyle="#ffe600";ctx.textAlign="center";ctx.textBaseline="middle";ctx.shadowColor="#360000";ctx.shadowBlur=3;
    ctx.fillText(title,px+pw*.62,py+ph*.52,maxWidth);ctx.shadowBlur=0;
    const qx=(qrRect.left-boardRect.left)*sx,qy=(qrRect.top-boardRect.top)*sy,qw=qrRect.width*sx,qh=qrRect.height*sy;ctx.drawImage(qrSource,qx,qy,qw,qh);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob)throw new Error("PNG");
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(person.member_id||id)+"-Car-Board.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
   }catch(err){alert("বোর্ডের ছবি ডাউনলোড করা যায়নি। আবার চেষ্টা করুন।");}
   finally{button.disabled=false;button.textContent=oldLabel;}
  });
 }catch(e){loading.textContent=e.message==="member"?"এই সদস্যের তথ্য পাওয়া যায়নি।":e.message==="qr"?"QR তৈরি করা যাচ্ছে না। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।":"সদস্যের তথ্য লোড করা যায়নি। আবার চেষ্টা করুন।";}
})();
</script></body></html>
