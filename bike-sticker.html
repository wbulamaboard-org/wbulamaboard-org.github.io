<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON DUTY Car Board | West Bengal Ulama Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#10224d;font-family:Arial,"Noto Sans Bengali",sans-serif}
.actions{max-width:1000px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 17px;background:#09245e;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
.note{background:#fff;border:1px solid #dce1e9;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700}
.stage{width:min(1000px,calc(100% - 24px));margin:0 auto 30px;background:#fff;padding:24px 16px;box-shadow:0 12px 30px #0002;border-radius:14px}
.sticker{position:relative;width:100%;aspect-ratio:10/7;container-type:inline-size;overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 0 0 5px #071b58,0 0 0 8px #e6b93f}
.sticker-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
/* Hide the QR/logo and scan text baked into the artwork; the live member QR is rendered above this clean white panel. */
.qr-cleanup{display:none}
.bike-qr{position:absolute;left:82.7%;top:56.4%;width:14.1%;aspect-ratio:1;background:#fff;padding:0;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;z-index:4}
.bike-qr canvas,.bike-qr img{width:100%!important;height:100%!important;display:block!important}
.member-name{position:absolute;left:8%;top:68.8%;width:70%;text-align:center;font-size:clamp(16px,3.1cqw,42px);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 2px 4px #000;z-index:5;overflow-wrap:anywhere}.member-id{position:absolute;left:8%;top:74.2%;width:70%;text-align:center;font-size:clamp(10px,1.65cqw,22px);font-weight:800;color:#fff;text-shadow:0 1px 3px #000;z-index:5}.qr-label{display:none}
.caption{text-align:center;color:#5e6877;font-size:12px;margin-top:14px}
@media(max-width:600px){.stage{padding:14px 9px}.sticker{border-radius:12px}.bike-qr{padding:2px;border-width:1px}.qr-label{display:none}.member-name{font-size:14px}.member-id{font-size:9px}}
@media print{@page{size:10in 7in;margin:0}body{background:#fff}.actions,.caption{display:none!important}.stage{width:10in;height:7in;margin:0;padding:0;box-shadow:none;border-radius:0}.sticker{width:10in;height:7in;margin:0 auto;aspect-ratio:auto;box-shadow:none;border-radius:0}}
</style></head><body>
<div class="actions"><a class="btn" href="index.html">← হোম</a><button class="btn" onclick="downloadBikeSticker()">⬇️ PNG ডাউনলোড</button><button class="btn" onclick="window.print()">🖨️ প্রিন্ট</button><span class="note">প্রিন্ট সাইজ: 10 × 7 inch • ON DUTY Car Board</span></div>
<div class="stage"><div class="sticker">
<img class="sticker-art" src="assets/WBUB_Car_Board_Template_10x7_300DPI.png?v=20261116-1" alt="West Bengal Ulama Board final bike sticker design">
<div class="bike-qr" id="bikeQr" role="img" aria-label="প্রত্যেক সদস্যের আলাদা QR যাচাইকরণ কোড"></div>
<div class="member-name" id="memberName"></div><div class="member-id" id="memberId"></div><div class="qr-label">SCAN TO VERIFY</div>
</div><div class="caption" id="caption">নতুন অনুমোদিত বাইক স্টিকার • সদস্যভিত্তিক QR যাচাইকরণ</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'"></script>
<script>
let currentMember=null;
(async function(){
 const id=new URLSearchParams(location.search).get("id")||"";
 const box=document.getElementById("bikeQr"),label=document.querySelector(".qr-label"),cap=document.getElementById("caption");
 if(!id){box.style.display="none";label.style.display="none";cap.textContent="প্রত্যেক সদস্যের নিজস্ব QR যুক্ত করতে ওয়েজিন ডিরেক্টরি থেকে সদস্যের Bike Sticker খুলুন";return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261105-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase()&&x.active!==false);
  if(!person)throw new Error("member");
  currentMember=person;
  document.getElementById("memberName").textContent=person.name||"সদস্য";
  document.getElementById("memberId").textContent=person.member_id||id;
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  if(typeof QRCode!=="undefined"){
   box.replaceChildren();
   new QRCode(box,{text:verify,width:320,height:320,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  } else {
   const qrImg=document.createElement("img");
   qrImg.alt="Member verification QR code";qrImg.referrerPolicy="no-referrer";
   qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&format=png&data="+encodeURIComponent(verify);
   await new Promise((resolve,reject)=>{qrImg.onload=()=>{box.replaceChildren(qrImg);resolve()};qrImg.onerror=reject;});
  }
  cap.textContent=(person.name||"সদস্য")+" • "+(person.member_id||id)+" • QR স্ক্যান করে সদস্য যাচাই করুন";
 }catch(e){box.style.display="none";label.style.display="none";cap.textContent="সদস্যের QR তৈরি করা যায়নি। আবার চেষ্টা করুন।";}
})();

async function downloadBikeSticker(){
 const id=new URLSearchParams(location.search).get("id")||"";
 const img=document.querySelector(".sticker-art");
 const qr=document.querySelector("#bikeQr canvas, #bikeQr img");
 if(!id||!qr){alert("সদস্যের QR তৈরি হওয়ার পর ডাউনলোড করুন।");return;}
 try{
  const canvas=document.createElement("canvas");canvas.width=3000;canvas.height=2100;
  const ctx=canvas.getContext("2d");
  await new Promise((resolve,reject)=>{if(img.complete&&img.naturalWidth)resolve();else{img.onload=resolve;img.onerror=reject;}});
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const sx=canvas.width,sy=canvas.height;
 const qx=.827*sx,qy=.564*sy,qw=.141*sx;
  if(qr.tagName==="CANVAS")ctx.drawImage(qr,qx,qy,qw,qw);else{
   const qimg=new Image();qimg.crossOrigin="anonymous";qimg.src=qr.src;
   await new Promise((resolve,reject)=>{qimg.onload=resolve;qimg.onerror=reject;});ctx.drawImage(qimg,qx,qy,qw,qw);
  }
  ctx.fillStyle="#071b58";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 84px Arial";ctx.fillText((currentMember&&currentMember.name)||"MEMBER",.43*sx,.715*sy,.70*sx);ctx.font="bold 48px Arial";ctx.fillText((currentMember&&currentMember.member_id)||id,.43*sx,.765*sy,.70*sx);
  const a=document.createElement("a");a.download="WBUB-Bike-Sticker-"+id+".png";a.href=canvas.toDataURL("image/png");a.click();
 }catch(e){alert("ডাউনলোড তৈরি করা যায়নি। পেজটি রিফ্রেশ করে আবার চেষ্টা করুন।");}
}
</script></body></html>
