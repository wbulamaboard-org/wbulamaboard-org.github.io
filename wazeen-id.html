<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Member ID | WAYEJIN FURFURA SHARIF</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><link rel="stylesheet" href="assets/site.css"><style>.wrapx{max-width:1050px;margin:auto;padding:28px 18px}.cardbox{max-width:520px;margin:20px auto;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px}.idcard{width:430px;max-width:100%;aspect-ratio:1.586/1;margin:auto;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#073f31,#07513f);color:#fff;padding:20px;position:relative}.idcard:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(226,200,121,.25);border-radius:50%;right:-55px;bottom:-80px}.gold{color:#e2c879}.idtop{font-size:11px;letter-spacing:.08em;font-weight:900}.idtitle{font-size:20px;font-weight:900;margin-top:5px}.idbody{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;margin-top:24px}.photo{width:90px;height:105px;border-radius:10px;background:#e8eeea;object-fit:cover}.name{font-size:20px;font-weight:900}.line{font-size:11px;margin-top:5px}.qr{width:82px;height:82px;background:#fff;border-radius:7px;padding:4px}.bottom{display:flex;justify-content:space-between;align-items:end;margin-top:20px}.actions{display:flex;gap:10px;margin-top:18px}.actions button,.actions a{flex:1;padding:12px;border:0;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:900;text-align:center}.message{padding:14px;border-radius:9px;background:#fff0f0;color:#8a2222;margin-top:16px}@media(max-width:620px){.wrapx{padding:18px 12px}.idcard{padding:15px}.idbody{grid-template-columns:72px 1fr}.photo{width:72px;height:86px}.name{font-size:17px}.qr{width:68px;height:68px}.actions{flex-direction:column}}@media print{header,.cardbox>p,.actions,.message{display:none!important}.wrapx{padding:0}.idcard{box-shadow:none}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">ওয়েজিন ফুরফুরা শরীফ<small>WAYEJIN E FURFURA SHARIF</small></a><nav><a href="registration.html">নিবন্ধন</a><a href="verification.html">ভেরিফিকেশন</a></nav></div></header><main><div class="wrapx"><div class="head"><h1>Digital Member ID</h1><p class="muted">Official ID view is driven by the approved backend record.</p></div><div class="cardbox"><div id="message" class="message" hidden></div><div id="card" class="idcard" hidden><div class="idtop gold">WEST BENGAL ULAMA BOARD</div><div class="idtitle">WAYEJIN FURFURA SHARIF</div><div class="idbody"><img id="photo" class="photo" alt="Member photo"><div><div id="name" class="name"></div><div class="line">Member ID: <strong id="mid"></strong></div><div class="line">Designation: <strong id="des"></strong></div><div class="line">District: <strong id="district"></strong></div><div class="line">Valid Till: <strong id="valid"></strong></div></div></div><div class="bottom"><div class="line">OFFICIAL DIGITAL ID</div><img id="qr" class="qr" alt="QR verification"></div></div><div class="actions" id="actions" hidden><button onclick="window.print()">Print / PDF</button><button id="download">Download PNG</button><a id="verify" href="#">Verify</a></div></div></div></main><script src="assets/member-workflow.js"></script><script src="assets/site.js" defer></script><script>const id=new URLSearchParams(location.search).get("id"),msg=document.getElementById("message"),card=document.getElementById("card"),actions=document.getElementById("actions");async function load(){if(!id){WBUB_WORKFLOW.showMessage(msg,"error","Member ID দেওয়া হয়নি।");return}try{const d=await WBUB_WORKFLOW.publicVerify(id);if(d.found!==true||!d.record)throw 0;const r=d.record;if(!["verified","approved","active"].includes(String(r.status||"").toLowerCase()))throw 0;document.getElementById("name").textContent=r.name||"Approved Member";document.getElementById("mid").textContent=r.member_id||id;document.getElementById("des").textContent=r.designation||"Member";document.getElementById("district").textContent=r.district||"-";document.getElementById("valid").textContent=r.valid_till||"-";const photo=document.getElementById("photo");if(r.photo_url)photo.src=r.photo_url;else photo.style.visibility="hidden";const verify=location.origin+location.pathname.replace("wazeen-id.html","verification.html")+"?id="+encodeURIComponent(r.member_id||id);document.getElementById("verify").href=verify;document.getElementById("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data="+encodeURIComponent(verify);card.hidden=false;actions.hidden=false;document.getElementById("download").onclick=async()=>{const canvas=await html2canvas(card,{scale:3,useCORS:true,backgroundColor:null});const a=document.createElement("a");a.download=(r.member_id||id)+"-ID.png";a.href=canvas.toDataURL("image/png");a.click()}}catch(e){WBUB_WORKFLOW.showMessage(msg,"error","Member ID Not Found / Invalid")}}load()</script></body></html>
