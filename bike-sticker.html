<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bike Sticker | West Bengal Ulama Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#10224d;font-family:Arial,"Noto Sans Bengali",sans-serif}
.actions{max-width:1000px;margin:18px auto 12px;padding:0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 17px;background:#09245e;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
.note{background:#fff;border:1px solid #dce1e9;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:700}
.stage{width:min(1000px,calc(100% - 24px));margin:0 auto 30px;background:#fff;padding:24px 16px;box-shadow:0 12px 30px #0002;border-radius:14px}
.sticker{position:relative;width:100%;aspect-ratio:2.4/1;overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 0 0 5px #071b58,0 0 0 8px #e6b93f}
.sticker-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.bike-qr{position:absolute;left:82.3%;top:40.2%;width:14.4%;aspect-ratio:1;background:#fff;padding:3px;border:2px solid #071b58;border-radius:7px;display:flex;align-items:center;justify-content:center;z-index:4}
.bike-qr canvas,.bike-qr img{width:100%!important;height:100%!important;display:block!important}
.qr-label{position:absolute;left:82%;top:75.2%;width:15%;text-align:center;font-size:clamp(6px,.85vw,10px);font-weight:900;color:#071b58;z-index:5}
.caption{text-align:center;color:#5e6877;font-size:12px;margin-top:14px}
@media(max-width:600px){.stage{padding:14px 9px}.sticker{border-radius:12px}.bike-qr{padding:2px;border-width:1px}.qr-label{font-size:5px}}
@media print{@page{size:A5 landscape;margin:0}body{background:#fff}.actions,.caption{display:none!important}.stage{width:210mm;height:148.5mm;margin:0;padding:18mm 5mm;box-shadow:none;border-radius:0}.sticker{width:200mm;height:83.33mm;margin:0 auto;aspect-ratio:auto;box-shadow:0 0 0 1.2mm #071b58,0 0 0 2mm #e6b93f;border-radius:4mm}}
</style></head><body>
<div class="actions"><a class="btn" href="index.html">← হোম</a><button class="btn" onclick="window.print()">🖨️ A4-এর হাফ সাইজে প্রিন্ট</button><span class="note">প্রিন্ট পেপার: A5 Landscape (A4-এর অর্ধেক) • 300 DPI উপযোগী ডিজাইন</span></div>
<div class="stage"><div class="sticker">
<img class="sticker-art" src="assets/WBUB_Bike_Sticker_Final-1.jpg?v=20261105-1" alt="West Bengal Ulama Board final bike sticker design">
<div class="bike-qr" id="bikeQr" role="img" aria-label="প্রত্যেক সদস্যের আলাদা QR যাচাইকরণ কোড"></div>
<div class="qr-label">SCAN TO VERIFY</div>
</div><div class="caption" id="caption">নতুন অনুমোদিত বাইক স্টিকার • সদস্যভিত্তিক QR যাচাইকরণ</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'"></script>
<script>
(async function(){
 const id=new URLSearchParams(location.search).get("id")||"";
 const box=document.getElementById("bikeQr"),label=document.querySelector(".qr-label"),cap=document.getElementById("caption");
 if(!id){box.style.display="none";label.style.display="none";cap.textContent="প্রত্যেক সদস্যের নিজস্ব QR যুক্ত করতে ওয়েজিন ডিরেক্টরি থেকে সদস্যের Bike Sticker খুলুন";return;}
 try{
  const res=await fetch("assets/master-member-database.json?v=20261105-1",{cache:"no-store"});
  if(!res.ok)throw new Error("database");
  const list=await res.json();
  const person=list.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase()&&x.active!==false);
  if(!person)throw new Error("member");
  const verify="https://wbulamaboard-org.github.io/verification.html?id="+encodeURIComponent(person.member_id||id);
  if(typeof QRCode!=="undefined"){
   box.replaceChildren();
   new QRCode(box,{text:verify,width:320,height:320,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  } else {
   const qrImg=document.createElement("img");
   qrImg.alt="Member verification QR code";qrImg.referrerPolicy="no-referrer";
   qrImg.src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&format=png&data="+encodeURIComponent(verify);
   await new Promise((resolve,reject)=>{qrImg.onload=()=>{box.replaceChildren(qrImg);resolve()};qrImg.onerror=reject;});
  }
  cap.textContent=(person.name||"সদস্য")+" • "+(person.member_id||id)+" • QR স্ক্যান করে সদস্য যাচাই করুন";
 }catch(e){box.style.display="none";label.style.display="none";cap.textContent="সদস্যের QR তৈরি করা যায়নি। আবার চেষ্টা করুন।";}
})();
</script></body></html>
