<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WBUB ID Card</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1ef;font-family:Arial,Helvetica,sans-serif}.page{padding:18px 10px 50px}.tools{max-width:1000px;margin:0 auto 15px;display:flex;gap:8px;flex-wrap:wrap}.tools a,.tools button{border:0;border-radius:10px;padding:11px 14px;background:#063b2e;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.tools .gold{background:#a17e30}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1000px;margin:auto}.card{position:relative;width:100%;aspect-ratio:711/995;overflow:hidden;background:#fff}.template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.layer{position:absolute;inset:0}.photo{position:absolute;left:4.1%;top:28.1%;width:40.8%;height:32.9%;object-fit:cover;border-radius:5%;display:none}.field{position:absolute;background:transparent;color:#111;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden}.name{left:45.0%;top:47.0%;width:50%;font-size:clamp(9px,1.45vw,15px);font-weight:900;line-height:1.05}.designation{left:45.0%;top:51.6%;width:50%;font-size:clamp(8px,1.35vw,14px);font-weight:700;line-height:1.05}.memberid{left:31.0%;top:60.2%;width:29%;font-size:clamp(8px,1.3vw,14px)}.district{left:31.0%;top:64.5%;width:29%;font-size:clamp(8px,1.3vw,14px)}.area{left:31.0%;top:68.8%;width:29%;font-size:clamp(8px,1.3vw,14px)}.phone{left:31.0%;top:73.0%;width:29%;font-size:clamp(8px,1.3vw,14px)}.valid{left:31.0%;top:77.1%;width:29%;font-size:clamp(8px,1.3vw,14px)}.qr{position:absolute;left:65.0%;top:59.0%;width:27.0%;height:17.5%;background:#fff;padding:1.5%;object-fit:contain}.back-qr{position:absolute;left:12%;top:69.2%;width:31%;height:14%;background:transparent;display:none}.print-note{text-align:center;color:#52615b;font-size:11px;font-weight:700;margin-top:10px}.loading{text-align:center;font-weight:900;padding:40px}.hidden{display:none!important}@media(max-width:760px){.cards{grid-template-columns:1fr;max-width:390px}}@media print{body{background:#fff}.tools,.print-note{display:none}.page{padding:0}.cards{display:block;max-width:none}.card{width:85.6mm;height:120mm;aspect-ratio:auto;margin:8mm auto;break-inside:avoid;page-break-after:always}.card:last-child{page-break-after:auto}}
</style>
</head>
<body>
<div class="page">
<div class="tools">
<a href="wazeens.html">← Wazeen Directory</a>
<button class="gold" id="frontBtn">🪪 Download Front</button>
<button class="gold" id="backBtn">🪪 Download Back</button>
<button id="printBtn">🖨 Print / Save PDF</button>
</div>
<div id="loading" class="loading">Loading member ID…</div>
<div id="cards" class="cards hidden">
<section class="card" id="frontCard">
<img class="template" src="assets/wbub-id-card-front-template.png" crossorigin="anonymous" alt="">
<div class="layer">
<img id="memberPhoto" class="photo" crossorigin="anonymous" alt="">
<div id="name" class="field name"></div>
<div id="designation" class="field designation"></div>
<div id="memberid" class="field memberid"></div>
<div id="district" class="field district"></div>
<div id="area" class="field area"></div>
<div id="phone" class="field phone"></div>
<div id="valid" class="field valid"></div>
<img id="frontQr" class="qr" alt="Verification QR">
</div>
</section>
<section class="card" id="backCard">
<img class="template" src="assets/wbub-id-card-back-template.png" crossorigin="anonymous" alt="">
</section>
</div>
<div class="print-note">প্রোফাইল থেকে Download ID Card চাপলে সদস্যভেদে তথ্য ও QR স্বয়ংক্রিয়ভাবে বসবে।</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get("id")||"";
 try{
  const res=await fetch("assets/master-member-database.json?v=20260928-22",{cache:"no-store"});
  if(!res.ok) throw Error("db");
  const data=await res.json();
  const m=data.find(x=>String(x.member_id||"").toLowerCase()===id.toLowerCase());
  if(!m) throw Error("member");
  const t=v=>String(v??"").trim()||"—";
  document.getElementById("name").textContent=t(m.name);
  document.getElementById("designation").textContent=t(m.designation||"OFFICIAL MEMBER");
  document.getElementById("memberid").textContent=t(m.member_id);
  document.getElementById("district").textContent=t(m.district||m.address);
  document.getElementById("area").textContent=t(m.block||m.area);
  document.getElementById("phone").textContent=t(m.phone);
  document.getElementById("valid").textContent=t(m.valid_till||m.validity);
  const photo=m.photo_url||m.photo||"";
  if(photo){const p=document.getElementById("memberPhoto");p.src=photo;p.style.display="block";}
  const verify=new URL("verification.html?id="+encodeURIComponent(m.member_id),location.href).href;
  const holder=document.createElement("div");
  new QRCode(holder,{text:verify,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  await new Promise(r=>setTimeout(r,120));
  const qimg=holder.querySelector("img")||holder.querySelector("canvas");
  if(qimg){document.getElementById("frontQr").style.display="block";document.getElementById("frontQr").src=qimg.tagName==="CANVAS"?qimg.toDataURL("image/png"):qimg.src;}
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("cards").classList.remove("hidden");
  async function save(el,filename){
   await new Promise(r=>setTimeout(r,250));
   const canvas=await html2canvas(el,{scale:3,useCORS:true,allowTaint:false,backgroundColor:"#fff",imageTimeout:15000});
   const a=document.createElement("a");a.download=filename;a.href=canvas.toDataURL("image/png");a.click();
  }
  document.getElementById("frontBtn").onclick=()=>save(document.getElementById("frontCard"),m.member_id+"-ID-Card-Front.png");
  document.getElementById("backBtn").onclick=()=>save(document.getElementById("backCard"),m.member_id+"-ID-Card-Back.png");
  document.getElementById("printBtn").onclick=()=>window.print();
 }catch(e){document.getElementById("loading").textContent="এই সদস্যের ID Card তথ্য পাওয়া যায়নি।";}
})();
</script>
</body></html>
