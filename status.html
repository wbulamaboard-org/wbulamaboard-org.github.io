<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আবেদনের অবস্থা | WAYEJIN FURFURA SHARIF</title><link rel="stylesheet" href="assets/site.css"><style>.workflow{max-width:760px;margin:auto}.cardx{background:#fff;border:1px solid #dce6e0;border-radius:18px;padding:24px;box-shadow:var(--shadow)}label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd9d2;border-radius:9px;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:900;font-size:16px}.workflow-message{margin-top:16px;padding:13px;border-radius:9px}.workflow-message.error{background:#fff0f0;color:#8a2222}.result{margin-top:18px;background:#f5f8f6;border-radius:12px;padding:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f4ec;color:#14613d;font-weight:900}.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #dce6e0}.row:last-child{border:0}.id-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.id-actions a{flex:1;min-width:180px;text-align:center;padding:12px;border-radius:9px;background:#d7b45b;color:#17372d;font-weight:900;text-decoration:none}.id-actions a.dark{background:#07513f;color:#fff}@media(max-width:620px){.cardx{padding:18px}.row{display:block}.row strong{display:block;margin-top:3px}.id-actions{flex-direction:column}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">ওয়েজিন ফুরফুরা শরীফ<small>WAYEJIN E FURFURA SHARIF</small></a><nav><a href="registration.html">নিবন্ধন</a><a href="member.html">সদস্য এলাকা</a><a href="verification.html">ভেরিফিকেশন</a></nav></div></header><main><section><div class="wrap workflow"><div class="cardx"><h1>আবেদনের অবস্থা</h1><p class="muted">Application Number এবং নিবন্ধিত মোবাইল নম্বর দিন।</p><form id="f"><label>Application Number *</label><input id="a" required autocomplete="off"><label>নিবন্ধিত মোবাইল নম্বর *</label><input id="m" required inputmode="numeric" maxlength="10" placeholder="১০ সংখ্যার মোবাইল নম্বর"><button id="b">স্ট্যাটাস দেখুন</button></form><div id="msg" hidden></div><div id="res" class="result" hidden></div></div></div></section></main><script src="assets/member-workflow.js"></script><script src="assets/site.js" defer></script><script>const f=document.getElementById("f"),msg=document.getElementById("msg"),res=document.getElementById("res"),b=document.getElementById("b");f.addEventListener("submit",async e=>{e.preventDefault();msg.hidden=true;res.hidden=true;const a=document.getElementById("a").value.trim(),m=document.getElementById("m").value;if(!a||!WBUB_WORKFLOW.validMobile(m)){WBUB_WORKFLOW.showMessage(msg,"error","সঠিক Application Number এবং ১০ সংখ্যার মোবাইল নম্বর দিন।");return}WBUB_WORKFLOW.setBusy(b,true,"স্ট্যাটাস খোঁজা হচ্ছে…");try{const d=await WBUB_WORKFLOW.lookupApplication(a,m);if(d.found!==true||!d.record)throw new Error("NOT_FOUND");const r=d.record;const memberId=r.member_id||r.wazeen_id||"";const rawStatus=String(r.status||"").trim().toLowerCase();const statusMap={"application received":"Application Received","received":"Application Received","pending":"Under Review","under review":"Under Review","approved":"Approved","rejected":"Rejected","information required":"Information Required","information_required":"Information Required"};const s=statusMap[rawStatus]||"Under Review";let extra="";if(String(r.status||"").toLowerCase()==="approved"&&memberId){const mid=encodeURIComponent(memberId);extra="<div class='id-actions'><a class='dark' href='wazeen-id.html?id="+mid+"'>🪪 ID Card খুলুন ও Download করুন</a><a href='verification.html?id="+mid+"'>✓ QR Verification</a></div>"}res.innerHTML="<div class='badge'>"+WBUB_WORKFLOW.escapeHtml(s)+"</div><div class='row'><span>Application Number</span><strong>"+WBUB_WORKFLOW.escapeHtml(a)+"</strong></div><div class='row'><span>বার্তা</span><strong>"+WBUB_WORKFLOW.escapeHtml(r.message||"আপনার আবেদন প্রক্রিয়াধীন।")+"</strong></div>"+extra;res.hidden=false}catch(err){WBUB_WORKFLOW.showMessage(msg,"error",err.message==="NOT_FOUND"?"রেকর্ড পাওয়া যায়নি। তথ্য মিলিয়ে আবার চেষ্টা করুন.":"স্ট্যাটাস সার্ভিসে সংযোগ করা যাচ্ছে না। পরে আবার চেষ্টা করুন।")}finally{WBUB_WORKFLOW.setBusy(b,false)}});</script></body></html>
